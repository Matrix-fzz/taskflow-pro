<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TaskFlow</title>
    <meta name="description" content="Create your TaskFlow account">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="background-gradient"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo">
                    <span class="logo-icon">✨</span>
                    TaskFlow
                </h1>
                <p class="auth-subtitle">Create your account to get started.</p>
            </div>

            <form id="signupForm" class="auth-form">
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name"
                        placeholder="John Doe" 
                        required
                        autocomplete="name"
                    />
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="your@email.com" 
                        required
                        autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="At least 6 characters" 
                        required
                        minlength="6"
                        autocomplete="new-password"
                    />
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword"
                        placeholder="Re-enter your password" 
                        required
                        minlength="6"
                        autocomplete="new-password"
                    />
                </div>

                <div class="form-group">
                    <label for="role">Account Type</label>
                    <select id="role" name="role" required>
                        <option value="user">👤 User (Team Member)</option>
                        <option value="chief_manager">👔 Chief Manager (Project Leader)</option>
                    </select>
                    <small class="form-help">Chief Managers can create projects and assign tasks</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="signupBtn">
                    <span id="signupBtnText">Create Account</span>
                    <span id="signupBtnLoader" class="btn-loader" style="display: none;">🔄</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Login</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Handle signup form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const errorMessage = document.getElementById('errorMessage');
            const signupBtn = document.getElementById('signupBtn');
            const signupBtnText = document.getElementById('signupBtnText');
            const signupBtnLoader = document.getElementById('signupBtnLoader');
            
            // Clear previous errors
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Disable button and show loader
            signupBtn.disabled = true;
            signupBtnText.style.display = 'none';
            signupBtnLoader.style.display = 'inline';
            
            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password, role })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || data.errors?.[0]?.msg || 'Signup failed');
                }
                
                // Store token and user info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Redirect to dashboard
                window.location.href = 'index.html';
            } catch (error) {
                console.log(error); 
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                
                // Re-enable button
                signupBtn.disabled = false;
                signupBtnText.style.display = 'inline';
                signupBtnLoader.style.display = 'none';
            }
        });
        
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
